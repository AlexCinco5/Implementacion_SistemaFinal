<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi cuenta · Entre Nubes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#2d5a3d;
  --pine-d:#1e3d28;
  --moss:#4a7c59;
  --sage:#8aa88f;
  --mint:#e6efe8;
  --cream:#fafaf5;
  --sand:#e8e2d4;
  --ink:#1a2e20;
  --muted:#6b7a6f;
  --line:#e2e8de;
  --soft:#f2f5ee;
  --rose:#a94a4a;
  --rose-soft:#fbeaea;
  --amber:#b45309;
  --amber-soft:#fef3c7;
  --blue:#1d4ed8;
  --blue-soft:#dbeafe;

  --ease:cubic-bezier(.2,0,0,1);
  --shadow-sm:0 1px 2px rgba(30,61,40,.06);
  --shadow-md:0 4px 12px rgba(30,61,40,.10);
  --shadow-lg:0 8px 28px rgba(30,61,40,.16);
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;color:var(--ink);background:var(--cream);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:8px}

/* NAV */
.nav{
  height:80px;display:flex;align-items:center;justify-content:space-between;
  padding:0 7%;position:sticky;top:0;z-index:60;
  background:rgba(250,250,245,.9);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
}
.logo{
  font:700 20px/1 Montserrat,sans-serif;color:var(--pine);letter-spacing:-.4px;
  display:inline-flex;align-items:center;gap:8px;
  transition:transform .3s var(--ease);
}
.logo:hover{transform:translateY(-1px)}
.logo svg{width:20px;height:20px;color:var(--pine)}
.nav-actions{display:flex;align-items:center;gap:12px}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;font-size:13px;font-weight:500;
  background:rgba(255,255,255,.9);
  transition:all .2s var(--ease);
}
.pill:hover{border-color:var(--sage);background:#fff}

/* LAYOUT */
.wrap{max-width:1100px;margin:40px auto;padding:0 20px 60px}
.profile-hero{
  display:flex;align-items:center;gap:20px;margin-bottom:32px;
  background:#fff;border:1px solid var(--line);padding:24px;border-radius:20px;
  box-shadow:var(--shadow-sm);
}
.avatar{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,var(--moss),var(--pine));
  color:#fff;display:grid;place-items:center;
  font:700 26px/1 Montserrat,sans-serif;
}
.profile-info h1{font:700 22px/1.2 Montserrat,sans-serif;margin:0 0 4px;letter-spacing:-.3px}
.profile-info p{margin:0;color:var(--muted);font-size:14px}

/* TABS */
.tabs{
  display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:28px;
  overflow-x:auto;scrollbar-width:none;
}
.tab{
  padding:10px 16px;font-weight:600;font-size:14px;color:var(--muted);
  border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
  transition:color .2s,border-color .2s;
}
.tab:hover{color:var(--pine)}
.tab.active{color:var(--pine);border-color:var(--pine)}

/* SECTIONS / PANELS */
.tab-content{display:none}
.tab-content.active{display:block}

.panel{
  background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:24px;margin-bottom:24px;box-shadow:var(--shadow-sm);
}
.panel h2{
  font:600 18px/1.3 Montserrat,sans-serif;margin:0 0 16px;
  display:flex;align-items:center;gap:8px;color:var(--pine);
}
.panel h2::before{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--pine);
}

/* RESERVATION CARD ITEM */
.reservation-card{
  display:grid;grid-template-columns:120px 1fr auto;gap:20px;align-items:center;
  padding:16px 0;border-bottom:1px solid var(--line);
}
.reservation-card:last-child{border-bottom:0;padding-bottom:0}
.reservation-card img{width:120px;height:88px;object-fit:cover;border-radius:12px}
.res-info h3{font:600 16px/1.3 Montserrat,sans-serif;margin:0 0 4px}
.res-info p{margin:0 0 6px;color:var(--muted);font-size:13.5px}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;
}
.badge.confirmed{background:var(--mint);color:var(--pine)}
.badge.pending{background:var(--amber-soft);color:var(--amber)}
.badge.review{background:var(--blue-soft);color:var(--blue)}
.badge.cancelled{background:var(--rose-soft);color:var(--rose)}

.res-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.btn{
  padding:8px 14px;border-radius:10px;font-weight:600;font-size:13.5px;
  transition:all .2s var(--ease);text-align:center;
}
.btn-primary{background:var(--pine);color:#fff}
.btn-primary:hover{background:var(--pine-d)}
.btn-outline{border:1px solid var(--line);color:var(--ink);background:#fff}
.btn-outline:hover{border-color:var(--sage);background:var(--soft)}
.btn-danger{color:var(--rose);background:var(--rose-soft)}
.btn-danger:hover{background:#f6d8d8}

/* FORM PROFILE */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.form-field input{
  padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);
  font-size:14px;transition:border-color .2s,background .2s;
}
.form-field input:focus{outline:0;border-color:var(--pine);background:#fff}

/* RESPONSIVE */
@media (max-width:768px){
  .reservation-card{grid-template-columns:1fr;gap:12px}
  .reservation-card img{width:100%;height:160px}
  .res-actions{align-items:stretch;flex-direction:row}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="logo" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 22V12M12 12c0-4 3-7 7-7 0 4-3 7-7 7Zm0 0c0-4-3-7-7-7 0 4 3 7 7 7Zm0-10c0-2-1.5-4-4-4 0 2 1.5 4 4 4Z" fill="currentColor" stroke="none"/>
    </svg>
    Entre Nubes
  </a>
  <div class="nav-actions">
    <a class="pill" href="index.html">Explorar estancias</a>
    <button class="pill" style="color:var(--rose)" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</nav>

<div class="wrap">
  <div class="profile-hero">
    <div class="avatar" id="userAvatar">--</div>
    <div class="profile-info">
      <h1 id="userName">Cargando...</h1>
      <p id="userEmail">Cargando...</p>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-target="reservas">Mis reservaciones</button>
    <button class="tab" data-target="favoritos">Mis favoritos</button>
    <button class="tab" data-target="historial">Historial de viajes</button>
    <button class="tab" data-target="cuenta">Datos de la cuenta</button>
    <button class="tab" data-target="notificaciones">
      Notificaciones <span id="tabNotifCount" style="display:none;margin-left:6px;background:var(--pine);color:#fff;padding:2px 7px;border-radius:999px;font-size:11px">0</span>
    </button>
  </div>

  <!-- PESTAÑA: RESERVACIONES -->
  <div class="tab-content active" id="reservas">
    <div class="panel">
      <h2>Próximas estancias</h2>
      <div id="listaReservasActivas">
        <p style="color:var(--muted)">Cargando reservaciones...</p>
      </div>
    </div>
  </div>

  <!-- PESTAÑA: FAVORITOS -->
  <div class="tab-content" id="favoritos">
    <div class="panel">
      <h2>Alojamientos guardados</h2>
      <div id="listaFavoritos">
        <p style="color:var(--muted)">Cargando favoritos...</p>
      </div>
    </div>
  </div>

  <!-- PESTAÑA: HISTORIAL -->
  <div class="tab-content" id="historial">
    <div class="panel">
      <h2>Viajes pasados y cancelados</h2>
      <div id="listaHistorial">
        <p style="color:var(--muted)">Cargando historial...</p>
      </div>
    </div>
  </div>

  <!-- PESTAÑA: CUENTA -->
  <div class="tab-content" id="cuenta">
    <div class="panel">
      <h2>Información personal</h2>
      <form id="formPerfil">
        <div class="form-grid">
          <div class="form-field">
            <label for="inputNombre">Nombre completo</label>
            <input type="text" id="inputNombre" value="" required>
          </div>
          <div class="form-field">
            <label for="inputTelefono">Teléfono / WhatsApp</label>
            <input type="tel" id="inputTelefono" value="" placeholder="+52 951 123 4567">
          </div>
          <div class="form-field full">
            <label for="inputEmail">Correo electrónico</label>
            <input type="email" id="inputEmail" value="" required readonly style="background:#e8e2d4; cursor:not-allowed;" title="El correo no se puede cambiar">
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:10px">Guardar cambios</button>
      </form>
    </div>
  </div>

  <!-- PESTAÑA: NOTIFICACIONES -->
  <div class="tab-content" id="notificaciones">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h2 style="margin:0">Mis notificaciones</h2>
        <button type="button" class="btn btn-outline" id="btnLeerTodasUsuario">Marcar todas como leídas</button>
      </div>
      <div id="listaNotificacionesUsuario">
        <p style="color:var(--muted)">Cargando notificaciones...</p>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = (window.location.hostname === 'localhost' || window.location.protocol === 'file:') ? 'http://localhost:8000' : '';

// Control de pestañas (Tabs)
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    tab.classList.add('active');
    document.getElementById(tab.dataset.target).classList.add('active');
  });
});

function formatoEstado(estado) {
  const mapa = {
    pendiente_pago: { texto: 'Pendiente de comprobante (15 min)', clase: 'pending' },
    en_revision:    { texto: 'Comprobante en revisión (24 h)',    clase: 'review' },
    confirmada:     { texto: 'Confirmada',                        clase: 'confirmed' },
    completada:     { texto: 'Completada',                        clase: 'confirmed' },
    expirada:       { texto: 'Expirada (tiempo agotado)',         clase: 'cancelled' },
    cancelada:      { texto: 'Cancelada',                         clase: 'cancelled' }
  };
  return mapa[estado] || { texto: estado, clase: 'pending' };
}

function renderTarjetaReserva(reserva) {
  const prop = reserva.alojamientos || {};
  const tituloPropiedad = prop.titulo || 'Alojamiento';
  const imgUrl = (prop.imagenes && prop.imagenes.length > 0)
    ? prop.imagenes[0]
    : 'https://images.unsplash.com/photo-1542718610-a1d656d1884c?w=400';

  const { texto, clase } = formatoEstado(reserva.estado);
  const esActiva = ['pendiente_pago', 'en_revision', 'confirmada'].includes(reserva.estado);
  const textoBotonPrincipal = reserva.estado === 'pendiente_pago' ? 'Subir comprobante' : 'Ver recibo';

  return `
    <div class="reservation-card" id="res-${reserva.id}">
      <img src="${imgUrl}" alt="${tituloPropiedad}">
      <div class="res-info">
        <h3>${tituloPropiedad}</h3>
        <p>Llegada: ${reserva.fecha_entrada} · Salida: ${reserva.fecha_salida}</p>
        <p>Total: $${Number(reserva.total_pagar).toLocaleString('es-MX')} MXN</p>
        <span class="badge ${clase}">${texto}</span>
      </div>
      <div class="res-actions">
        <button class="btn btn-primary" onclick="verRecibo('${reserva.id}')">${textoBotonPrincipal}</button>
        ${esActiva ? `<button class="btn btn-danger" onclick="cancelarReserva('${reserva.id}')">Cancelar reserva</button>` : ''}
      </div>
    </div>
  `;
}

function renderTarjetaFavorito(item) {
  const prop = item.alojamientos;
  if (!prop) return '';
  const imgUrl = (prop.imagenes && prop.imagenes.length > 0)
    ? prop.imagenes[0]
    : 'https://images.unsplash.com/photo-1542718610-a1d656d1884c?w=400';

  return `
    <div class="reservation-card" id="fav-${prop.id}">
      <img src="${imgUrl}" alt="${prop.titulo}">
      <div class="res-info">
        <h3>${prop.titulo}</h3>
        <p>${prop.tipo || 'Alojamiento'} · ${prop.direccion || 'Capulálpam de Méndez'}</p>
        <p><strong>$${Number(prop.precio_noche).toLocaleString('es-MX')} MXN</strong> / noche · ${prop.capacidad_huespedes} huéspedes</p>
      </div>
      <div class="res-actions">
        <a class="btn btn-primary" href="propiedad.html?id=${prop.id}">Ver alojamiento</a>
        <button class="btn btn-danger" onclick="quitarFavorito('${prop.id}')">Quitar de favoritos</button>
      </div>
    </div>
  `;
}

async function quitarFavorito(alojamientoId) {
  const jwt = localStorage.getItem('jwt');
  try {
    const res = await fetch(`${API_URL}/api/favoritos/${alojamientoId}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${jwt}` }
    });
    if (res.ok) {
      const card = document.getElementById(`fav-${alojamientoId}`);
      if (card) card.remove();
      const cont = document.getElementById('listaFavoritos');
      if (cont && !cont.querySelector('.reservation-card')) {
        cont.innerHTML = '<p style="color:var(--muted);">Aún no tienes alojamientos guardados en favoritos.</p>';
      }
    }
  } catch (e) {
    console.error('Error quitando favorito:', e);
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  const jwt = localStorage.getItem('jwt');
  if (!jwt) {
    window.location.href = 'login.html';
    return;
  }

  // 1. Cargar perfil actualizado desde FastAPI
  try {
    const resPerfil = await fetch(`${API_URL}/api/usuarios/me`, {
      headers: { 'Authorization': `Bearer ${jwt}` }
    });
    if (resPerfil.status === 401) {
      cerrarSesion();
      return;
    }
    const perfil = await resPerfil.json();

    document.getElementById('userName').textContent = perfil.nombre_completo;
    document.getElementById('userEmail').textContent = perfil.correo + ' · Miembro verificado';
    document.getElementById('inputNombre').value = perfil.nombre_completo;
    document.getElementById('inputTelefono').value = perfil.telefono || '';
    document.getElementById('inputEmail').value = perfil.correo;

    const initials = perfil.nombre_completo.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
    document.getElementById('userAvatar').textContent = initials;
  } catch (error) {
    console.error('Error cargando perfil:', error);
  }

  // 2. Cargar reservaciones desde FastAPI
  try {
    const res = await fetch(`${API_URL}/api/usuarios/me/reservaciones`, {
      headers: { 'Authorization': `Bearer ${jwt}` }
    });
    const reservas = await res.json();
    
    const contenedorActivas = document.getElementById('listaReservasActivas');
    const contenedorHistorial = document.getElementById('listaHistorial');

    const activas = reservas.filter(r => ['pendiente_pago', 'en_revision', 'confirmada'].includes(r.estado));
    const historial = reservas.filter(r => ['completada', 'cancelada', 'expirada'].includes(r.estado));

    contenedorActivas.innerHTML = activas.length
      ? activas.map(renderTarjetaReserva).join('')
      : '<p style="color:var(--muted);">No tienes reservaciones activas en este momento.</p>';

    contenedorHistorial.innerHTML = historial.length
      ? historial.map(renderTarjetaReserva).join('')
      : '<p style="color:var(--muted);">Aún no tienes viajes pasados o cancelados.</p>';
  } catch (error) {
    console.error('Error cargando reservaciones:', error);
    document.getElementById('listaReservasActivas').innerHTML = '<p style="color:var(--rose);">Ocurrió un error al cargar tus reservaciones.</p>';
  }

  // 3. Cargar favoritos desde FastAPI
  try {
    const resFav = await fetch(`${API_URL}/api/favoritos`, {
      headers: { 'Authorization': `Bearer ${jwt}` }
    });
    const dataFav = await resFav.json();
    const contFav = document.getElementById('listaFavoritos');
    const lista = dataFav.favoritos || [];

    contFav.innerHTML = lista.length
      ? lista.map(renderTarjetaFavorito).join('')
      : '<p style="color:var(--muted);">Aún no tienes alojamientos guardados en favoritos.</p>';
  } catch (error) {
    console.error('Error cargando favoritos:', error);
    document.getElementById('listaFavoritos').innerHTML = '<p style="color:var(--rose);">Ocurrió un error al cargar tus favoritos.</p>';
  }
});

function verRecibo(id) {
  localStorage.setItem('ultimo_folio', id);
  window.location.href = `recibo.html?id=${id}`;
}

async function cancelarReserva(id) {
  if (!confirm('¿Estás seguro de que deseas cancelar esta reservación? Esta acción no se puede deshacer.')) return;

  const jwt = localStorage.getItem('jwt');
  try {
    const res = await fetch(`${API_URL}/api/reservaciones/${id}/cancelar`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${jwt}` }
    });
    if (res.ok) {
      alert('Reservación cancelada con éxito.');
      location.reload();
    } else {
      alert('Hubo un problema al cancelar la reservación.');
    }
  } catch (e) {
    console.error(e);
    alert('No se pudo conectar con el servidor.');
  }
}

function cerrarSesion() {
  localStorage.clear();
  window.location.href = 'login.html';
}

document.getElementById('formPerfil').addEventListener('submit', async (e) => {
  e.preventDefault();
  const jwt = localStorage.getItem('jwt');
  const nombre_completo = document.getElementById('inputNombre').value.trim();
  const telefono = document.getElementById('inputTelefono').value.trim();

  try {
    const res = await fetch(`${API_URL}/api/usuarios/me`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${jwt}`
      },
      body: JSON.stringify({ nombre_completo, telefono })
    });
    if (res.ok) {
      localStorage.setItem('reserva_nombre', nombre_completo);
      localStorage.setItem('reserva_telefono', telefono);
      alert('Cambios guardados en tu cuenta.');
      location.reload();
    } else {
      alert('No se pudieron guardar los cambios.');
    }
  } catch (error) {
    console.error(error);
    alert('Error de conexión con el servidor.');
  }
});
</script>

<script src="notificaciones.js"></script>
<script>
window.addEventListener('en:notificaciones', (e) => {
  const { notificaciones = [], sin_leer = 0 } = e.detail || {};
  const badge = document.getElementById('tabNotifCount');
  if (badge) {
    badge.textContent = sin_leer;
    badge.style.display = sin_leer > 0 ? 'inline-block' : 'none';
  }
  const cont = document.getElementById('listaNotificacionesUsuario');
  if (!cont) return;
  if (!notificaciones.length) {
    cont.innerHTML = '<p style="color:var(--muted)">Aún no tienes notificaciones.</p>';
    return;
  }
  cont.innerHTML = notificaciones.map(n => `
    <div style="padding:14px;border-radius:12px;margin-bottom:10px;border:1px solid var(--line);background:${n.leida ? '#fff' : 'var(--mint)'};display:flex;justify-content:space-between;gap:14px;align-items:center">
      <div>
        <strong style="display:block;font-size:14.5px;color:var(--ink)">${n.titulo}</strong>
        <p style="margin:4px 0 0;color:var(--muted);font-size:13.5px">${n.mensaje}</p>
      </div>
      ${n.reservacion_id ? `<button class="btn btn-outline" onclick="abrirNotifUsuario('${n.id}','${n.reservacion_id}')">Ver reserva</button>` : ''}
    </div>
  `).join('');
});

async function abrirNotifUsuario(notifId, reservaId) {
  const jwt = localStorage.getItem('jwt');
  await fetch(`${API_URL}/api/notificaciones/${notifId}/leer`, {
    method: 'PUT',
    headers: { 'Authorization': `Bearer ${jwt}` }
  });
  verRecibo(reservaId);
}

document.getElementById('btnLeerTodasUsuario')?.addEventListener('click', async () => {
  const jwt = localStorage.getItem('jwt');
  await fetch(`${API_URL}/api/notificaciones/leer-todas`, {
    method: 'PUT',
    headers: { 'Authorization': `Bearer ${jwt}` }
  });
  if (window.cargarNotificacionesEntreNubes) window.cargarNotificacionesEntreNubes();
});
</script>
</body>
</html>
