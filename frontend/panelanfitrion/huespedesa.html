<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huéspedes · Entre Nubes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">
  <!-- Lo llena sidebar.js -->
  <aside class="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Huéspedes</h1>
        <div class="date" id="subHuesp">Cargando huéspedes...</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="label">Huéspedes en mis alojamientos</div><div class="value" id="stTotalH">0</div></div>
      <div class="stat"><div class="label">Reservas totales</div><div class="value" id="stConRes">0</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Mis huéspedes</h3></div>
      <table class="table">
        <thead>
          <tr>
            <th>Huésped</th>
            <th>Contacto</th>
            <th>Reservas</th>
            <th>Último estado</th>
            <th>Último viaje</th>
          </tr>
        </thead>
        <tbody id="tablaHuespedes">
          <tr><td colspan="5" style="text-align:center;color:var(--muted)">Cargando...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="admin-footer">
      <span>© 2026 Entre Nubes · Panel de anfitrión</span>
      <span><a href="../index.html">Ir al sitio público</a></span>
    </div>
  </main>
</div>

<script>
const API_URL = (window.location.hostname === 'localhost' || window.location.protocol === 'file:') ? 'http://localhost:8000' : '';
const jwt = localStorage.getItem('jwt');
const rol = localStorage.getItem('user_rol');

// Solo comodidad de UI: la seguridad real la aplica el backend con el JWT.
if (!jwt || rol !== 'anfitrion') window.location.href = '../login.html';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ESTADOS = {
  confirmada:     { clase: 'confirmed', texto: 'Confirmada' },
  completada:     { clase: 'confirmed', texto: 'Completada' },
  en_revision:    { clase: 'pending',   texto: 'Comprobante recibido' },
  pendiente_pago: { clase: 'pending',   texto: 'Esperando SPEI' },
  cancelada:      { clase: 'cancelled', texto: 'Cancelada' },
  expirada:       { clase: 'cancelled', texto: 'Expirada' }
};

document.addEventListener('DOMContentLoaded', async () => {
  const tbody = document.getElementById('tablaHuespedes');
  try {
    const res = await fetch(`${API_URL}/api/anfitrion/huespedes`, {
      headers: { 'Authorization': `Bearer ${jwt}` }
    });
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem('jwt');
      window.location.href = '../login.html';
      return;
    }
    const lista = await res.json();

    document.getElementById('stTotalH').textContent = lista.length;
    document.getElementById('stConRes').textContent = lista.reduce((t, h) => t + Number(h.total_reservas || 0), 0);
    document.getElementById('subHuesp').textContent =
      `${lista.length} ${lista.length === 1 ? 'huésped ha' : 'huéspedes han'} reservado en tus alojamientos`;

    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted)">Aún no tienes huéspedes en tus alojamientos.</td></tr>';
      return;
    }

    tbody.innerHTML = lista.map(h => {
      const nombre = h.nombre_completo || 'Huésped';
      const ini = nombre.split(' ').filter(Boolean).map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'HU';
      const est = ESTADOS[h.ultimo_estado] || { clase: 'pending', texto: h.ultimo_estado || '—' };
      return `
        <tr>
          <td>
            <div class="guest">
              <div class="avatar-tiny a2">${esc(ini)}</div>
              <div><b>${esc(nombre)}</b><small>${esc(h.telefono || 'Sin teléfono')}</small></div>
            </div>
          </td>
          <td>${esc(h.correo || '—')}</td>
          <td>${esc(h.total_reservas)} ${Number(h.total_reservas) === 1 ? 'reserva' : 'reservas'}</td>
          <td><span class="badge ${est.clase}">${esc(est.texto)}</span></td>
          <td>${esc(h.ultimo_viaje || '—')}</td>
        </tr>
      `;
    }).join('');
  } catch (e) {
    console.error(e);
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted)">No se pudieron cargar los huéspedes.</td></tr>';
  }
});
</script>
<script src="../notificaciones.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
